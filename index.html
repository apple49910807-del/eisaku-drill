<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>英作ドリル</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{--bg:#f2f4f0;--panel:#ffffff;--ink:#16211c;--mute:#5d6b64;--line:#d9dfd7;--clay:#b4532a;--chalk:#fbfcfa;
--f-disp:'Barlow Condensed','Arial Narrow',sans-serif;--f-body:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1613;--panel:#17211c;--ink:#e8eee9;--mute:#9fb0a6;--line:#2b3a32;--clay:#e5895e;--chalk:#121b17;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;display:grid;place-items:center;
padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
form{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);padding:26px 24px;display:grid;gap:14px}
h1{font-family:var(--f-disp);font-size:30px;letter-spacing:.06em;margin:0;line-height:1.1;border-bottom:2px solid var(--ink);padding-bottom:8px}
h1 small{display:block;font-family:var(--f-body);font-size:13px;font-weight:500;letter-spacing:0;color:var(--mute);margin-top:4px}
label{font-size:13px;font-weight:700;color:var(--mute)}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);background:var(--chalk);color:var(--ink);border-radius:2px}
input:focus-visible,button:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
button{font:inherit;font-weight:700;border:1.5px solid var(--clay);background:var(--clay);color:#fff;padding:10px 16px;border-radius:2px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--clay);font-size:13px;min-height:1.4em;margin:0}
</style>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function unlock(pw){
  const key=await derive(pw);
  const buf=b64(P.data);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12));
  window.__PRKEY=key;
  const html=new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
return unlock;
})();

<body>
<form id="f" autocomplete="off">
  <h1>英作ドリル<small>Eisaku Drill</small></h1>
  <div><label for="pw">パスワード</label>
  <input id="pw" type="password" autocomplete="current-password" required></div>
  <label class="row"><input id="rem" type="checkbox" checked> このブラウザで、パスワードを覚えておく</label>
  <p class="err" id="err" role="alert"></p>
  <button id="go" type="submit">開く</button>
</form>
<script>(()=>{
const $=id=>document.getElementById(id);
async function tryOpen(pw,remember,silent){
  $('go').disabled=true; $('err').textContent='';
  try{
    if(!window.crypto||!crypto.subtle) throw new Error('nocrypto');
    if(remember){try{localStorage.setItem('eisaku.pw',pw)}catch(e){}}
    await window.__unlock(pw);
  }catch(e){
    $('go').disabled=false;
    if(e&&e.message==='nocrypto'){$('err').textContent='このブラウザでは開けません。https のアドレスで開いてください。';return}
    try{localStorage.removeItem('eisaku.pw')}catch(_){}
    if(!silent) $('err').textContent='パスワードが違います。';
  }
}
$('f').addEventListener('submit',ev=>{ev.preventDefault();tryOpen($('pw').value,$('rem').checked,false)});
try{const saved=localStorage.getItem('eisaku.pw'); if(saved) tryOpen(saved,false,true)}catch(e){}
})();
</script>
</body>
